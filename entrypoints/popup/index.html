<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Dual Subs</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 14px 16px;
        font: 14px/1.5 -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #1d1d1f;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 9px 0;
      }
      select,
      input[type='range'] {
        width: 140px;
      }
      p {
        margin: 12px 0 0;
        font-size: 12px;
        color: #6e6e73;
      }
    </style>
  </head>
  <body>
    <h1>Crunchyroll 双语字幕</h1>
    <label>启用 <input id="enabled" type="checkbox" /></label>
    <label>
      原字幕语言
      <select id="sourceLang">
        <option value="en-US">English</option>
        <option value="ja-JP">日本語</option>
        <option value="es-419">Español (LatAm)</option>
        <option value="fr-FR">Français</option>
        <option value="de-DE">Deutsch</option>
      </select>
    </label>
    <label>
      翻译成
      <select id="targetLang">
        <option value="zh-CN">简体中文</option>
        <option value="zh-TW">繁體中文</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="en">English</option>
      </select>
    </label>
    <label>
      翻译方式
      <select id="engine">
        <option value="claude-code">本机 Claude Code（用订阅）</option>
        <option value="api">Claude API（用 key）</option>
        <option value="machine">只用机翻</option>
      </select>
    </label>
    <label>
      Claude API key
      <input id="apiKey" type="password" placeholder="sk-ant-…" autocomplete="off" style="width: 140px" />
    </label>
    <label>
      模型
      <select id="model">
        <option value="claude-opus-5-5">Opus 5.5（质量最好）</option>
        <option value="claude-sonnet-5-5">Sonnet 5.5（更便宜）</option>
      </select>
    </label>
    <label>
      译名习惯
      <select id="nameStyle">
        <option value="mainland">大陆（贝吉塔）</option>
        <option value="taiwan">台湾（達爾）</option>
        <option value="hongkong">香港（比達）</option>
      </select>
    </label>
    <label>显示原文 <input id="showOriginal" type="checkbox" /></label>
    <label>
      字体
      <select id="fontFamily">
        <option value="hei">黑体（苹方）</option>
        <option value="yuan">圆体</option>
        <option value="song">宋体</option>
        <option value="kai">楷体</option>
        <option value="hand">手写（手札体）</option>
      </select>
    </label>
    <label>
      译文颜色
      <select id="trColor">
        <option value="mint">薄荷绿</option>
        <option value="cream">暖白</option>
        <option value="white">纯白</option>
        <option value="yellow">琥珀黄</option>
        <option value="sky">天蓝</option>
        <option value="sakura">樱花粉</option>
      </select>
    </label>
    <label>字号 <input id="fontSize" type="range" min="60" max="180" step="5" /></label>
    <label>离底部距离 <input id="bottomOffset" type="range" min="0" max="40" step="1" /></label>
    <p>“本机 Claude Code”需要先在项目目录运行 <code>npm run bridge</code>。API key 只在选“Claude API”时使用，只保存在本机。</p>
    <p>开着“显示原文”时，请在 Crunchyroll 播放器里把自带字幕关掉，避免两套字幕重叠。</p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
